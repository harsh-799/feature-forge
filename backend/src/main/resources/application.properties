spring.application.name=backend

# DB Related
spring.datasource.url=jdbc:postgresql://localhost:5432/feature_forge
spring.datasource.username=postgres
spring.datasource.password=ideapad

# Hibernate Stuffs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Related
jwt.secret=${JWT_SECRET}

# User Invitation Related
invitation.expiry.days=7

# Brevo mail services
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=FeatureForge
