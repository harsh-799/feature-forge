spring.application.name=backend

# DB Related
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Hibernate Stuffs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Related
jwt.secret=${JWT_SECRET}

# User Invitation Related
invitation.expiry.days=7

# Brevo Mail Services
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_SENDER_NAME}
brevo.frontend-url=${BREVO_FRONTEND_URL}

# Frontend URL
featureforge.frontend-url=${FEATUREFORGE_FRONTEND_URL}